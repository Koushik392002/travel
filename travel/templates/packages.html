<!DOCTYPE html>
<html>
<head>
    <title>Travel Packages</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        h2 {
            text-align: center;
            margin: 30px 0;
            color: #333;
        }

        .container {
            width: 90%;
            margin: auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            width: 300px;
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin-bottom: 10px;
            color: #007bff;
        }

        .card p {
            margin: 6px 0;
            color: #444;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: green;
            margin-top: 10px;
        }

        .seats-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .seats-row label {
            font-size: 14px;
            color: #333;
            font-weight: bold;
            white-space: nowrap;
        }

        .date-input {
            flex: 1;
            padding: 8px 10px;
            border: 1.5px solid #c0d6f5;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .date-input:focus {
            border-color: #007bff;
        }

        .btn {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 14px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<script>
function setAction(form, PackageId) {
    const seats = form.querySelector('[name="num_seats"]').value;
    form.action = `/bookings/package/${PackageId}/${seats}/`;
}
</script>

<body>
{% if user.is_authenticated %}
    <a href="/accounts/logout">Logout</a>
{% endif %}

<h2>Available Travel Packages</h2>

<div class="container">

    {% for package in packages %}
    <div class="card">
        <h3>{{ package.title }}</h3>

        <p><b>Description:</b> {{ package.description }}</p>
        <p><b>Duration:</b> {{ package.duration }} days</p>

        <div class="price">
            ₹{{ package.price }}
        </div>

        <form method="POST" action="/book/package/{{ package.id }}/" onsubmit="setAction(this, {{ package.id }})">
            {% csrf_token %}

            <div class="seats-row">
                <label for="seats_{{ package.id }}">Seats:</label>
                <input
                    class="date-input"
                    type="number"
                    id="seats_{{ package.id }}"
                    name="num_seats"
                    value="1"
                    min="1"
                    max="10"
                    required
                />
            </div>

            <button type="submit" class="btn">Book Now</button>
        </form>
    </div>

    {% empty %}
        <h3 style="text-align:center;">No Packages Available</h3>
    {% endfor %}

</div>

</body>
</html>
